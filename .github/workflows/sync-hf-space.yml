name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'space/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push space/ to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure git
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          # Clone just the space/ directory into a temp repo
          TMPDIR=$(mktemp -d)
          cp -r space/* "$TMPDIR/"

          cd "$TMPDIR"
          git init -b main
          git add .
          git commit -m "Sync from GitHub $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Push to Hugging Face Space
          git push --force \
            "https://USER:${HF_TOKEN}@huggingface.co/spaces/${{ secrets.HF_SPACE_NAME }}" \
            main
