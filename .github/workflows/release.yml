name: Release desktop

# Сборка настольной программы VoxPaperAi Pro (PyInstaller) и публикация
# артефактов в GitHub Releases. Имена артефактов версионированы НЕ в имени
# файла, поэтому стабильные ссылки вида
#   https://github.com/<owner>/<repo>/releases/latest/download/<asset>
# всегда отдают последнюю сборку (их использует шаг «Программа» онбординга).
#
# Триггеры:
#  - push тега v*  (например v1.0.0) — релиз с версией тега;
#  - workflow_dispatch — релиз версии из файла VERSION (или inputs.tag).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (пусто = v<VERSION из файла VERSION>)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: VoxPaperAi-Pro-windows-x64.zip
          - os: macos-14 # Apple Silicon (arm64)
            asset: VoxPaperAi-Pro-macos-apple-silicon.dmg
          # macOS Intel собирается отдельно: .github/workflows/release-intel.yml —
          # раннеры macos-13 (Intel) подолгу стоят в очереди, поэтому x86_64-сборка
          # идёт на macos-14 под Rosetta (x64-Python) и загружается в тот же релиз.
          - os: ubuntu-latest
            asset: VoxPaperAi-Pro-linux-x64.tar.gz

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only torch (без CUDA-сборок ~2 ГБ на Linux)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Generate icon.ico (Windows/Linux)
        if: runner.os != 'macOS'
        run: >-
          python -c "from PIL import Image; img = Image.open('src/ui/assets/logo.png').convert('RGBA'); img.save('resources/icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean "VoxPaperAi_Pro.spec"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/VoxPaperAi Pro" -DestinationPath "${{ matrix.asset }}" -Force

      # macOS-артефакт — классический DMG-образ: пользователь открывает его и
      # перетаскивает приложение на ярлык Applications (привычная установка).
      # Состав образа повторяет структуру из INSTALL_FREE_MACOS.txt:
      # приложение + ярлык Applications + инструкция + DISCLAIMER.
      - name: Package (macOS DMG)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg-staging
          cp -R "dist/VoxPaperAi Pro.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          cp INSTALL_FREE_MACOS.txt dmg-staging/
          cp DISCLAIMER.txt dmg-staging/
          hdiutil create -volname "VoxPaperAi Pro" -srcfolder dmg-staging -ov -format UDZO "${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist "VoxPaperAi Pro"

      - name: Read version
        if: github.event_name == 'workflow_dispatch'
        id: ver
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Release tag
        if: github.event_name == 'workflow_dispatch'
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || steps.tag.outputs.name }}
          name: VoxPaperAi Pro ${{ github.event_name == 'push' && github.ref_name || steps.tag.outputs.name }}
          body: |
            Настольная программа VoxPaperAi Pro — полностью локальная версия: сайт и браузер не нужны.

            ## Загрузки
            - **Windows 64-bit:** VoxPaperAi-Pro-windows-x64.zip
            - **macOS Apple Silicon (M1–M4):** VoxPaperAi-Pro-macos-apple-silicon.dmg
            - **macOS Intel:** VoxPaperAi-Pro-macos-intel.dmg
            - **Linux x64:** VoxPaperAi-Pro-linux-x64.tar.gz

            ## Первый запуск
            - **Windows:** распакуйте ZIP (правый клик → «Извлечь всё…»), откройте папку и запустите «VoxPaperAi Pro». Если появится SmartScreen — «Подробнее» → «Выполнить в любом случае» (сборка без платной цифровой подписи, исходники открыты).
            - **macOS:** откройте DMG и перетащите «VoxPaperAi Pro.app» на ярлык «Applications» в открывшемся окне, затем извлеките образ. При окне «Apple не удалось подтвердить…» снимите карантин командой в Терминале: `xattr -cr "/Applications/VoxPaperAi Pro.app"` (вставьте целиком, без лишних символов) — затем откройте приложение обычным двойным кликом. Без Терминала: Системные настройки → «Конфиденциальность и безопасность» → «Открыть всё равно». В macOS 15+ правый клик → «Открыть» обход не предлагает.
            - **Linux:** `tar -xzf VoxPaperAi-Pro-linux-x64.tar.gz -C ~/Downloads`, затем запустите `~/Downloads/"VoxPaperAi Pro"/"VoxPaperAi Pro"`.

            При первом запуске программа попросит согласие с Политикой конфиденциальности и Отказом от ответственности. Программа бесплатна.

            ## Состав
            Whisper (транскрибация), yt-dlp (скачивание/URL-задачи), переводчик, конвертер медиа и документов. Согласие показывается до начала работы.
          draft: false
          prerelease: false
          files: ${{ matrix.asset }}
