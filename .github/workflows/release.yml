name: Release desktop

# Сборка настольной программы VoxPaperAi Pro (PyInstaller) и публикация
# артефактов в GitHub Releases. Имена артефактов версионированы НЕ в имени
# файла, поэтому стабильные ссылки вида
#   https://github.com/<owner>/<repo>/releases/latest/download/<asset>
# всегда отдают последнюю сборку (их использует шаг «Программа» онбординга).
#
# Триггеры:
#  - push тега v*  (например v1.0.0) — релиз с версией тега;
#  - workflow_dispatch — релиз версии из файла VERSION (или inputs.tag).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (пусто = v<VERSION из файла VERSION>)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: VoxPaperAi-Pro-windows-x64.zip
          - os: macos-14 # Apple Silicon (arm64)
            asset: VoxPaperAi-Pro-macos-apple-silicon.dmg
          # macOS Intel собирается отдельно: .github/workflows/release-intel.yml —
          # раннеры macos-13 (Intel) подолгу стоят в очереди, поэтому x86_64-сборка
          # идёт на macos-14 под Rosetta (x64-Python) и загружается в тот же релиз.
          - os: ubuntu-latest
            asset: VoxPaperAi-Pro-linux-x64.tar.gz

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install torch 2.8.0 CPU (пин из-за pytorch#166628)
        run: |
          python -m pip install --upgrade pip
          # torch 2.9–2.14 на Windows падает в PyInstaller-сборке при загрузке
          # c10.dll: WinError 1114 (DLL initialization routine failed) — в 2.9
          # появился явный ctypes-загрузчик _load_dll_libraries, который ломается
          # когда runtime-hook PyInstaller уже загрузил Qt DLL. Исправлено только
          # в torch 2.15 (её ещё нет на индексе CPU-колёс). Рабочая проверенная
          # версия — 2.8.0: https://github.com/pytorch/pytorch/issues/166628
          pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Generate icon.ico (Windows/Linux)
        if: runner.os != 'macOS'
        run: >-
          python -c "from PIL import Image; img = Image.open('src/ui/assets/logo.png').convert('RGBA'); img.save('resources/icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean "VoxPaperAi_Pro.spec"

      # deno — JS-рантайм решателя EJS (PO Token) для yt-dlp. Пип-пакет deno
      # кладёт бинарник в scripts-директорию venv (НЕ в модуль), поэтому
      # PyInstaller его не собирает. В замороженном приложении yt-dlp ищет
      # deno в первую очередь рядом с exe (dirname(sys.executable)), поэтому
      # копируем бинарник в корень приложения (yt_dlp/utils/_jsruntime.py).
      # Без него решатель мёртв → PO Token пропускает все форматы →
      # «Requested format is not available» в портативной сборке.
      - name: Bundle deno (EJS solver runtime for yt-dlp)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          Copy-Item "$scripts/deno.exe" "dist/VoxPaperAi Pro/" -Force
          & "dist/VoxPaperAi Pro/deno.exe" --version

      - name: Bundle deno (EJS solver runtime for yt-dlp)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts=$(python -c "import sysconfig; print(sysconfig.get_path('scripts'))")
          if [ "$RUNNER_OS" = "macOS" ]; then
            dest="dist/VoxPaperAi Pro.app/Contents/MacOS"
          else
            dest="dist/VoxPaperAi Pro"
          fi
          cp "$scripts/deno" "$dest/"
          chmod +x "$dest/deno"
          "$dest/deno" --version

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/VoxPaperAi Pro" -DestinationPath "${{ matrix.asset }}" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}").Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Out-File -FilePath "${{ matrix.asset }}.sha256" -Encoding ascii

      # macOS-артефакт — классический DMG-образ: пользователь открывает его и
      # перетаскивает приложение на ярлык Applications (привычная установка).
      # Состав образа повторяет структуру из INSTALL_FREE_MACOS.txt:
      # приложение + ярлык Applications + инструкция + DISCLAIMER.
      - name: Package (macOS DMG)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg-staging
          cp -R "dist/VoxPaperAi Pro.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          cp INSTALL_FREE_MACOS.txt dmg-staging/
          cp DISCLAIMER.txt dmg-staging/
          hdiutil create -volname "VoxPaperAi Pro" -srcfolder dmg-staging -ov -format UDZO "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf "${{ matrix.asset }}" -C dist "VoxPaperAi Pro"
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Read version
        if: github.event_name == 'workflow_dispatch'
        id: ver
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Release tag
        if: github.event_name == 'workflow_dispatch'
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || steps.tag.outputs.name }}
          name: VoxPaperAi Pro ${{ github.event_name == 'push' && github.ref_name || steps.tag.outputs.name }}
          body: |
            Настольная программа VoxPaperAi Pro — полностью локальная версия: сайт и браузер не нужны.

            ## Загрузки
            - **Windows 64-bit:** VoxPaperAi-Pro-windows-x64.zip
            - **macOS Apple Silicon (M1–M4):** VoxPaperAi-Pro-macos-apple-silicon.dmg
            - **macOS Intel:** VoxPaperAi-Pro-macos-intel.dmg
            - **Linux x64:** VoxPaperAi-Pro-linux-x64.tar.gz

            Рядом с каждым файлом лежит `*.sha256` — контрольная сумма для проверки целостности скачанного архива.

            ## Первый запуск
            - **Windows:** распакуйте ZIP (правый клик → «Извлечь всё…»). Программа портативная — устанавливать ничего не нужно: перенесите папку «VoxPaperAi Pro» в постоянное место (Документы, Рабочий стол, C:\Tools — но не C:\Program Files) и всегда запускайте из него. Запустите «VoxPaperAi Pro». Если появится SmartScreen — «Подробнее» → «Выполнить в любом случае» (сборка без платной цифровой подписи, исходники открыты).
            - **Windows, ошибка DLL:** если при запуске появляется «WinError 1114» или упоминание «c10.dll» — установите [Microsoft Visual C++ Redistributable (x64)](https://aka.ms/vs/17/release/vc_redist.x64.exe), перезагрузите ПК и запустите снова. Поддерживаются Windows 10/11 (64-бит); в сборке v1.0.6 эта ошибка исправлена — скачайте актуальный ZIP.
            - **macOS:** откройте DMG и перетащите «VoxPaperAi Pro.app» на ярлык «Applications» в открывшемся окне, затем извлеките образ. При окне «Apple не удалось подтвердить…» снимите карантин командой в Терминале: `xattr -cr "/Applications/VoxPaperAi Pro.app"` (вставьте целиком, без лишних символов) — затем откройте приложение обычным двойным кликом. Без Терминала: Системные настройки → «Конфиденциальность и безопасность» → «Открыть всё равно». В macOS 15+ правый клик → «Открыть» обход не предлагает.
            - **Linux:** `tar -xzf VoxPaperAi-Pro-linux-x64.tar.gz -C ~/Downloads`, затем запустите `~/Downloads/"VoxPaperAi Pro"/"VoxPaperAi Pro"`.

            При первом запуске программа попросит согласие с Политикой конфиденциальности и Отказом от ответственности. Программа бесплатна.

            ## Состав
            Whisper (транскрибация), yt-dlp со встроенным решателем PO Token (JS-рантайм deno внутри сборки), переводчик, конвертер медиа и документов. Согласие показывается до начала работы.
          draft: false
          prerelease: false
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
