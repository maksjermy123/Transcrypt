name: Windows E2E — движок и конвертер

# Проверка проекта на НАСТОЯЩЕЙ Windows-машине (runner windows-latest):
#   1. Запускаем РОВНО тот установщик, который выполняет пользователь
#      (engine-install/install-win.ps1): поиск Python с обходом заглушки
#      Microsoft Store, venv, установка зависимостей (torch/whisper/docx/
#      pypdf/reportlab/pdf2docx), запуск движка, автозапуск в реестре.
#   2. Проверяем /api/health (версия, docs/jobs/queue).
#   3. Прогоняем e2e-тесты конвертера документов: docx→txt (кириллица,
#      без «крякозябр»), docx→pdf, txt в CP1251 → pdf/docx/txt, pdf→docx, pdf→txt.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine_server.py'
      - 'engine-install/**'
      - 'src/core/**'
      - 'src/utils/**'
      - 'tests/e2e_doc_conversion.py'
      - '.github/workflows/windows-e2e.yml'

jobs:
  windows-e2e:
    name: Windows — установщик + конвертер
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Установщик движка (реальный путь пользователя, PowerShell 5.1)
        shell: pwsh
        env:
          # CI согласие принимает автоматически (в установщике: политика +
          # отказ от ответственности показываются, интерактива нет — переменная
          # единственный способ пройти дальше; пользователи в терминале
          # отвечают на промпт вручную).
          TRANSCRYPT_CONSENT: "yes"
        run: |
          # stdin -> NUL: неинтерактивный запуск; согласие в установщике
          # принимается через TRANSCRYPT_CONSENT=yes (см. env выше).
          # Запускаем через `powershell` (5.1) — именно его используют студенты
          # в однострочнике установки; 7+ покрывается тем же кодом.
          cmd /c 'powershell -NoProfile -ExecutionPolicy Bypass -File engine-install\install-win.ps1 < NUL'

      - name: /api/health — версия >= 1.3.0, docs/jobs/queue
        shell: pwsh
        run: |
          $h = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 10
          $h | ConvertTo-Json -Depth 5 | Write-Host
          if ($h.jobs -ne $true)  { throw "health.jobs = $($h.jobs)" }
          if ($h.queue -ne $true) { throw "health.queue = $($h.queue)" }
          if ($h.docs -ne $true)  { throw "health.docs = $($h.docs) — библиотеки конвертации не установились" }
          $v = [version]$h.version
          if ($v -lt [version]"1.3.0") { throw "версия движка $($h.version) < 1.3.0" }
          Write-Host "OK: движок $($h.version), docs=$($h.docs), jobs=$($h.jobs), queue=$($h.queue)"

      - name: E2E конвертации (docx/pdf/txt, кириллица, CP1251)
        shell: pwsh
        run: |
          $py = "$env:USERPROFILE\.transcrypt-engine\venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { throw "venv-питон не найден: $py" }
          & $py tests/e2e_doc_conversion.py
          if ($LASTEXITCODE -ne 0) { throw "e2e-тесты конвертера провалились (код $LASTEXITCODE)" }

      - name: Диагностика при падении — последние строки лога движка
        if: failure()
        shell: pwsh
        run: |
          $log = "$env:USERPROFILE\.transcrypt-engine\engine.log"
          if (Test-Path $log) {
            Write-Host "=== engine.log (последние 60 строк) ==="
            Get-Content $log -Tail 60 | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "engine.log не найден"
          }
