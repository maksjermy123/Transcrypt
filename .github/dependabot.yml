# Dependabot: обновления версий + security-PR при CVE.
#
# ВАЖНО (урок инцидента PyMuPDF 2.0 от 2026-10-19): pip-зависимости в
# requirements.txt строго запинены, у многих пинов задокументированная причина
# (совместимость openai-whisper/pkg_resources, pdf2docx↔pymupdf, numpy, torch).
# Поднимать пин можно только после проверки всей цепочки сборки
# (Windows/macOS ARM/macOS Intel/Linux, PyInstaller). Поэтому pip — раз в месяц
# и с малым лимитом PR. Security-PR (automated security fixes) приходят
# отдельно и только при реальных CVE.
#
# NOTE (PyMuPDF 2.0 incident, 2026-10-19): pip pins in requirements.txt are
# strict and several carry documented reasons (openai-whisper/pkg_resources,
# pdf2docx↔pymupdf, numpy, torch). Never bump a pin without validating the
# whole build chain (Windows/macOS ARM/macOS Intel/Linux, PyInstaller). Hence
# pip is monthly with a low PR limit. Security PRs arrive separately on CVEs.
#
# ПОЛИТИКА МАЖОРОВ / MAJOR POLICY: ignore-правила ниже запрещают автоматические
# МАЖОРНЫЕ обновления (x.y.z → (x+1).0.0). Минорные и патч-обновления приходят
# автоматически и проверяются CI. Мажоры поднимаем вручную в плановом цикле
# (отдельная задача, с полной проверкой сборки/релиза). Примеры, почему:
# TypeScript 7 (новый компилятор), pypdf 6, pyqt6 6.11, framer-motion 14,
# lucide-react 1.x, action-gh-release v3 (проверка на реальном релизе).
# Если появится CVE с фиксом только в мажоре — снимаем ignore точечно.
# MAJOR POLICY: ignore rules below block automatic MAJOR bumps; minor and
# patch updates keep flowing and are validated by CI. Majors are lifted
# manually in a planned cycle with a full build/release check. If a CVE fix
# lands only in a major, lift the ignore for that dependency specifically.
version: 2
updates:
  # Действия в workflow-файлах — еженедельно, одним PR.
  # GitHub Actions used by workflows — weekly, grouped into one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 3

  # Веб-фронт (web/package.json + web/bun.lock) — еженедельно; major —
  # отдельными PR, minor+patch сгруппированы. CI (tsc + next build) проверит
  # каждый PR. Экосистема именно "bun": проект использует bun.lock (Bun),
  # экосистема npm его не понимает и падает с ошибкой конфигурации.
  # Web frontend (web/package.json + web/bun.lock, Bun) — weekly; majors stay
  # separate, minor+patch grouped. CI (tsc + next build) validates each PR.
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      bun-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 5

  # Python-движок (корневой requirements.txt) — раз в месяц из-за строгих пинов.
  # Python engine (root requirements.txt) — monthly due to strict pins.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 3
