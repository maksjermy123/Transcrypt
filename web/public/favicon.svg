  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Letter T -->
  <path d="
    M 14 18
    L 50 18
    L 50 25
    L 38 25
    L 38 50
    L 26 50
    L 26 25
